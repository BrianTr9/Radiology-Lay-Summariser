[project]
name = "laysum"
version = "0.1.0"
description = "Research prototype: plain-language drafts of chest X-ray reports with rule-based review flags"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
eval = { file = ["eval/requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["training"]  # the trained-model code is kept as it ran (Python 3.11)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
